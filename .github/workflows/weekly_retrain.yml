# .github/workflows/weekly_retrain.yml
# ─────────────────────────────────────────────────────────────────────────────
# WEEKLY MODEL RETRAINING
# Runs every Monday at 06:00 UTC.
#
# What it does:
#   1. Wakes the Render service and triggers a full retrain
#   2. The Render service retrains XGBoost on all historical data
#   3. Then runs one epoch of DQN training on the accumulated replay buffer
#   4. Saves the new model to Supabase Storage and registers it in model_versions
#   5. If the new model beats the current one on validation log-loss, it's
#      promoted to active — otherwise the old model stays in place
#
# Why weekly and not daily?
#   - The PL only plays ~3-4 matches per week. That's not enough new data
#     to meaningfully retrain daily.
#   - The DQN needs enough replay buffer entries to sample from.
#     After a full weekend, we typically have 6-10 new episodes to add.
#   - Render free tier has a 750h/month limit. Weekly retraining uses ~4h/month.
#
# Manual retraining (e.g. after a long break or season restart):
#   Go to GitHub Actions → weekly_retrain → Run workflow
# ─────────────────────────────────────────────────────────────────────────────

name: Weekly model retraining

on:
  schedule:
    # 06:00 UTC every Monday
    - cron: "0 6 * * 1"

  workflow_dispatch:
    inputs:
      force_promote:
        description: "Promote new model even if validation is worse"
        required: false
        default: "false"
        type: boolean

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run retraining script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FORCE_PROMOTE: ${{ inputs.force_promote || 'false' }}
        run: python scripts/retrain.py --force-promote=$FORCE_PROMOTE
